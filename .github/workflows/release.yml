name: Release split-per-abi

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install Android NDK & CMake (flutter_live2d C++ modules)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          "$SDKMANAGER" --install "cmake;3.10.2" "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/NTgram-${VERSION}-arm64-v8a-release.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/NTgram-${VERSION}-armeabi-v7a-release.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/NTgram-${VERSION}-x86_64-release.apk"
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "NTgram $TAG" \
            --notes "NTgram $TAG（arm64-v8a / armeabi-v7a / x86_64 分架构 release 包）"
